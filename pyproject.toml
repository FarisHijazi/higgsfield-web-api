[project]
name = "higgsfield-web-api"
version = "0.1.0"
description = "Unofficial OpenAI-compatible API over the higgsfield.ai web app (nano_banana images, incl. the free 'unlimited' path)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-cookie3>=0.20.1",
    "curl-cffi>=0.16.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[project.scripts]
higgsfield-web-api = "higgsfield_api.server:run"
higgsfield-web-api-cli = "higgsfield_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["higgsfield_api"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
